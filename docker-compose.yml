version: '3.8'

services:
  app-blue:
    image: nginx:alpine
    container_name: app-blue-v1
    volumes:
      - ./app-blue:/usr/share/nginx/html:ro
    ports:
      - "8081:80"

  app-green:
    image: nginx:alpine
    container_name: app-green-v2
    volumes:
      - ./app-green:/usr/share/nginx/html:ro
    ports:
      - "8082:80"

  router:
    image: nginx:alpine
    container_name: nginx-router
    volumes:
      - ./router/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - app-blue
      - app-green
